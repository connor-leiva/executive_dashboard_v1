[project]
name = "spring-command-center-api"
version = "0.1.0"
description = "Spring Command Center — executive financial + operational dashboard API"
requires-python = ">=3.11"
# Base deps run the app on SQLite with zero native-build friction (local dev).
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cryptography>=42",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "anthropic>=0.40",          # the dashboard assistant (Claude Messages API)
    "python-multipart>=0.0.9",  # multipart file uploads (Binder document ingestion)
    "boto3>=1.34",              # S3-compatible client for Cloudflare R2 document storage
]

[project.optional-dependencies]
# Production database drivers (Railway/Postgres). Native builds — install in CI/Docker.
postgres = [
    "asyncpg>=0.29",            # async driver for the app
    "psycopg[binary]>=3.1",     # sync driver for alembic
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

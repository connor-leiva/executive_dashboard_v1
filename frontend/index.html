<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/logo/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/logo/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/logo/favicon-180.png" />
    <!-- Archivo carries every number and label (tabular figures); Outfit carries prose.
         preconnect first so the CSS request does not wait on a fresh TLS handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Generic on purpose: this is the title BEFORE the app knows which tenant it is.
         useMe() replaces it with "{tenant} · {product}" the moment /me answers, so a second
         customer never sees the first one's name flash in their tab. -->
    <title>Command Center</title>
    <style>
      /* Form controls do not inherit font-family — browsers give them their own default, so every
         button and input in the app rendered in Arial while the text beside it followed the
         workspace typeface. One line, and it is the difference between a typeface setting that
         reaches the product and one that reaches most of it.

         Deliberately narrow: this is NOT a global reset. There is no box-sizing reset in this app
         and adding one would move a great deal of layout. */
      button, input, select, textarea { font-family: inherit; }
      body { font-family: var(--font-text); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
